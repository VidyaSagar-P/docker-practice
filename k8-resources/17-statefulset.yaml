apiVersion: v1
kind: Service
metadata:
  name: nginx-headless-svc
  labels:
    app: nginx-hs
spec:
  ports:
  - port: 80
    name: web
  clusterIP: None
  selector:
    purpose: headless
    project: roboshop
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nrml-svc
  labels:
    app: nginx-nrml
spec:
  ports:
  - port: 80
    name: web
  selector:
    purpose: headless
    project: roboshop
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-hs
  labels:
    purpose: headless
    project: roboshop
spec:
  selector:
    matchLabels:
      labels:
        purpose: headless
        project: roboshop
  replicas: 3 # by default is 1
  template:
    metadata:
      labels:
        purpose: headless
        project: roboshop
    spec:
      containers:
      - name: nginx
        image: nginx
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "efs-dynamic"
      resources:
        requests:
          storage: 1Gi
