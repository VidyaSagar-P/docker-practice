networks:
  default:
    driver: bridge
    name: roboshop
    #external: true #if network is already created

volumes:
  mongodb:

services:
  catalogue:
    image: vidya07422/catalogue:v1
    container_name: catalogue
    # environment:
    #   MONGO_URL: "mongodb://mongodb:27017/catalogue"
    #   MONGO: true
    depends_on:
      - mongodb
  
  mongodb:
    image: vidya07422/mongodb:v1
    container_name: mongodb
    volumes:
      - mongodb:/data/db

  frontend:
    image: vidya07422/frontend:v1
    container_name: frontend
    ports:
      - 80:80
    depends_on:
      - catalogue
