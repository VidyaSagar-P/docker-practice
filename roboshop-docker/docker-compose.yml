networks:
  default:
    driver: bridge
    name: roboshop
    #external: true #if network is already created

volumes:
  mongodb:

services:
  catalogue:
    build: ./catalogue
    image: catalogue:v1
    container_name: catalogue
    environment:
      MONGO_URL: "mongodb://mongodb:27017/catalogue"
      MONGO: true
    depends_on:
      - mongodb
  
  mongodb:
    build: ./mongodb
    image: mongodb:v1
    container_name: mongodb
    volumes:
      - mongodb:/data/db

  frontend:
    build: ./frontend
    image: frontend:v1
    container_name: frontend
    ports:
      - 80:80
    depends_on:
      - catalogue
